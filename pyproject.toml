[project]
name = "energy-weather-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Syed Ali Murtaza Bokhari", email = "syedalimurtaza36@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.65.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
energy-weather-hub = "energy_weather_hub:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
